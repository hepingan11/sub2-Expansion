name: Publish Release Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish
        required: true
        default: v0.2.2
        type: string
      source_ref:
        description: Git ref to build
        required: true
        default: v0.2.2
        type: string

permissions:
  contents: read
  packages: write

env:
  RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend-go
            file: ./backend-go/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/sub2-expansion-backend
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/sub2-expansion-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || github.ref }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: |
            APP_VERSION=${{ env.RELEASE_TAG }}
          tags: |
            ${{ matrix.image }}:${{ env.RELEASE_TAG }}
            ${{ matrix.image }}:latest
